<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>记账小助手 · 3 秒记一笔</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#f4f5f3;          /* 页面暖灰白 */
  --surface:#ffffff;     /* 卡片 */
  --surface-2:#fbfbf9;
  --ink:#14150f;         /* 主墨 */
  --ink-2:#52544b;       /* 次级 */
  --muted:#8a8d82;       /* 弱化 */
  --line:#e6e7e1;        /* 分隔线 */
  --brand:#16a06a;       /* 薄荷绿 · 收入/正向 */
  --brand-weak:#e4f4ec;
  --expense:#e8603c;     /* 暖橙 · 支出 */
  --expense-weak:#fdeee8;
  --warn:#fab219;
  --crit:#d03b3b;

  /* dataviz 验证过的 categorical 固定顺序 (light) */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --seq:#2a78d6;

  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 3px rgba(20,21,15,.06), 0 8px 24px rgba(20,21,15,.05);
  --sans:"DIN Alternate", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --tnum:"SF Mono", "DIN Alternate", ui-monospace, "Menlo", monospace;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============ 手机外框 ============ */
#app{
  max-width:460px;margin:0 auto;min-height:100dvh;
  background:var(--bg);position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(20,21,15,.08);
}

/* ============ 顶栏 / 概览卡 ============ */
.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px}
.month-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.month-row button{
  width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink-2);
  display:grid;place-items:center;transition:background .15s}
.month-row button:active{background:var(--line)}
.month-row .label{font-size:17px;font-weight:600;letter-spacing:.3px;min-width:118px;text-align:center}

.overview{
  background:linear-gradient(135deg,#191b13,#2a2d20);color:#fff;
  border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.overview::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(22,160,106,.4),transparent 70%);pointer-events:none}
.ov-label{font-size:12px;opacity:.7;letter-spacing:.5px}
.ov-balance{font-size:34px;font-weight:700;margin:2px 0 16px;letter-spacing:-.5px}
.ov-split{display:flex;gap:26px}
.ov-split .k{font-size:11px;opacity:.65;margin-bottom:3px}
.ov-split .v{font-size:16px;font-weight:600}
.ov-split .v.exp{color:#ff9d80}
.ov-split .v.inc{color:#6fe0a9}

/* 预算条 */
.budget{margin-top:14px}
.budget-head{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-bottom:6px}
.budget-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.budget-bar > i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .4s ease}
.budget-bar > i.over{background:var(--crit)}
.budget-bar > i.near{background:var(--warn)}

/* ============ 主体滚动区 ============ */
main{flex:1;overflow-y:auto;padding:18px 18px 120px;-webkit-overflow-scrolling:touch}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- 流水列表 ---- */
.day-group{margin-bottom:8px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 4px 8px;font-size:12px;color:var(--muted)}
.day-head .d{font-weight:600;color:var(--ink-2)}
.day-head .sum{font-variant-numeric:tabular-nums}
.rec-card{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);overflow:hidden}
.rec{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative;
  border-bottom:1px solid var(--line);background:var(--surface);transition:transform .2s}
.rec:last-child{border-bottom:none}
.rec .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:var(--surface-2);flex:none}
.rec .meta{flex:1;min-width:0}
.rec .cat{font-size:15px;font-weight:500}
.rec .note{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .amt{font-family:var(--tnum);font-size:16px;font-weight:600;flex:none}
.rec .amt.exp{color:var(--ink)}
.rec .amt.inc{color:var(--brand)}
.rec-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.rec-wrap:last-child{border-bottom:none}
.rec-del{position:absolute;right:0;top:0;bottom:0;width:76px;background:var(--crit);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:600}

.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty .big{font-size:44px;margin-bottom:12px}
.empty p{margin:4px 0;font-size:14px}
.empty .hint{font-size:12px;opacity:.7}

/* ============ 底部 Tab ============ */
nav{
  position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:8px 0 calc(8px + var(--safe-b));z-index:30}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--muted);padding:4px 0;transition:color .15s}
nav button .ni{font-size:20px;line-height:1}
nav button.active{color:var(--ink)}
nav button.active .ni{transform:scale(1.05)}

/* 悬浮记账按钮：浮在导航栏右上方，避免遮挡中间 Tab */
.fab{
  position:fixed;right:22px;bottom:calc(80px + var(--safe-b));
  width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;
  font-size:30px;font-weight:300;display:grid;place-items:center;z-index:31;
  box-shadow:0 8px 22px rgba(22,160,106,.42);transition:transform .12s}
.fab:active{transform:scale(.92)}
@media (min-width:461px){ /* 居中容器内右对齐 */
  .fab{right:max(22px, calc(50% - 230px + 22px))}
}

/* ============ 记账抽屉 (signature) ============ */
.sheet-mask{position:fixed;inset:0;background:rgba(20,21,15,.4);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .25s}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;z-index:41;
  background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:var(--safe-b);
  max-height:94dvh;display:flex;flex-direction:column}
.sheet.open{transform:none}

/* 收支切换 */
.tabs{display:flex;justify-content:center;gap:8px;padding:16px 0 10px}
.tabs button{padding:7px 20px;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{color:#fff}
.tabs button.on.exp{background:var(--expense)}
.tabs button.on.inc{background:var(--brand)}

/* 金额显示 */
.amount-disp{text-align:center;padding:4px 24px 14px}
.amount-disp .cur{font-size:22px;color:var(--ink-2);vertical-align:6px;margin-right:2px}
.amount-disp .num{font-family:var(--tnum);font-size:44px;font-weight:700;letter-spacing:-1px}
.amount-disp .num.dim{color:var(--muted)}
.amount-disp .expr{font-family:var(--tnum);font-size:13px;color:var(--muted);height:16px}

/* 分类宫格 */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 4px;padding:6px 12px 12px;
  overflow-y:auto}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;
  border-radius:14px;transition:background .15s}
.cat-item .e{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:var(--surface-2);transition:all .15s}
.cat-item .n{font-size:11px;color:var(--ink-2)}
.cat-item.sel .e{background:var(--brand);transform:scale(1.06)}
.cat-item.sel.exp .e{background:var(--expense)}
.cat-item.sel .n{color:var(--ink);font-weight:600}

/* 备注 + 日期行 */
.extra{display:flex;gap:8px;padding:2px 14px 10px}
.extra input,.extra .datepick{flex:1;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:13px;background:var(--surface-2);color:var(--ink);font-family:inherit}
.extra input::placeholder{color:var(--muted)}
.extra .datepick{flex:none;position:relative;display:flex;align-items:center;gap:6px}
.extra .datepick input{border:none;background:none;padding:0;width:112px}

/* 数字键盘 */
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.keypad button{background:var(--surface);font-family:var(--tnum);font-size:23px;font-weight:500;
  padding:16px 0;transition:background .1s;color:var(--ink)}
.keypad button:active{background:var(--line)}
.keypad button.fn{font-size:17px;color:var(--ink-2)}
.keypad button.save{background:var(--brand);color:#fff;font-weight:700;font-size:18px;grid-row:span 2}
.keypad button.save.exp{background:var(--expense)}
.keypad button.save:disabled{background:var(--muted);opacity:.6}
.keypad button.again{font-size:13px;color:var(--brand)}

/* ============ 报表 ============ */
.section-t{font-size:13px;font-weight:600;color:var(--ink-2);margin:22px 4px 12px;letter-spacing:.3px}
.section-t:first-child{margin-top:4px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--radius-sm);padding:15px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--muted);margin-bottom:6px}
.stat .v{font-family:var(--tnum);font-size:22px;font-weight:700}
.stat .v.exp{color:var(--expense)}
.stat .v.inc{color:var(--brand)}

.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{flex:none}
.donut-center{font-family:var(--tnum)}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;
  padding:2px 0;border-radius:8px}
.legend-row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.legend-row .pct{font-family:var(--tnum);color:var(--muted);font-size:12px}
.legend-row .val{font-family:var(--tnum);font-weight:600;font-size:13px}

/* 趋势柱状 */
.trend{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;
  justify-content:flex-end;position:relative}
.bar-col .bar{width:70%;max-width:14px;background:var(--seq);border-radius:4px 4px 0 0;
  min-height:2px;transition:height .4s ease;opacity:.9}
.bar-col .bar.today{background:var(--brand)}
.bar-col .lbl{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 排行 */
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:none}
.rank-row .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:var(--surface-2);flex:none}
.rank-row .info{flex:1;min-width:0}
.rank-row .nm{font-size:14px;font-weight:500}
.rank-row .mini{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.rank-row .mini > i{display:block;height:100%;border-radius:3px}
.rank-row .amt{font-family:var(--tnum);font-weight:600;font-size:14px;flex:none;text-align:right}
.rank-row .amt small{display:block;font-size:11px;color:var(--muted);font-weight:400}

/* ============ 我的 ============ */
.list{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);
  font-size:15px;width:100%;text-align:left}
.li:last-child{border-bottom:none}
.li .e{font-size:19px}
.li .arr{margin-left:auto;color:var(--muted);font-size:16px}
.li .sub{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.brandline{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 4px}
.brandline b{color:var(--ink-2)}

/* 预算编辑弹层 & 提示 */
.mini-modal-mask{position:fixed;inset:0;background:rgba(20,21,15,.4);z-index:50;display:none;
  align-items:center;justify-content:center;padding:30px}
.mini-modal-mask.open{display:flex}
.mini-modal{background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:320px;box-shadow:var(--shadow)}
.mini-modal h3{margin:0 0 4px;font-size:17px}
.mini-modal p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.mini-modal input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;
  font-size:18px;font-family:var(--tnum);text-align:center;margin-bottom:14px;background:var(--surface-2);color:var(--ink)}
.mini-modal .btns{display:flex;gap:10px}
.mini-modal .btns button{flex:1;padding:12px;border-radius:12px;font-size:15px;font-weight:600}
.mini-modal .btns .ghost{background:var(--surface-2);color:var(--ink-2)}
.mini-modal .btns .primary{background:var(--brand);color:#fff}

.toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-20px);z-index:60;
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn);color:var(--ink)}
.toast.crit{background:var(--crit)}

/* ============ 登录/注册门禁 ============ */
#authGate{position:fixed;inset:0;z-index:100;background:var(--bg);
  display:none;flex-direction:column;overflow-y:auto}
#authGate.show{display:flex}
.auth-hero{background:linear-gradient(135deg,#191b13,#2a2d20);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 56px) 30px 40px;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;right:-50px;top:-30px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(22,160,106,.42),transparent 70%);pointer-events:none}
.auth-hero .logo{font-size:40px;margin-bottom:14px}
.auth-hero h1{font-size:26px;margin:0 0 6px;font-weight:700;letter-spacing:.5px}
.auth-hero p{margin:0;font-size:13px;opacity:.72}
.auth-body{flex:1;max-width:460px;width:100%;margin:0 auto;padding:26px 26px 40px}
.auth-seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:22px;
  border:1px solid var(--line)}
.auth-seg button{flex:1;padding:10px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);transition:all .18s}
.auth-seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:7px;font-weight:600}
.field input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  font-size:15px;background:var(--surface);color:var(--ink);font-family:inherit;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--brand)}
.field .hint{font-size:11px;color:var(--muted);margin-top:6px}
.auth-err{background:var(--expense-weak);color:var(--crit);font-size:13px;
  padding:10px 14px;border-radius:11px;margin-bottom:16px;display:none}
.auth-err.show{display:block}
.auth-submit{width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;
  font-size:16px;font-weight:700;transition:transform .12s,opacity .15s}
.auth-submit:active{transform:scale(.98)}
.auth-submit:disabled{opacity:.55}
.auth-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.7}
.auth-foot b{color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- 登录/注册门禁 -->
<div id="authGate">
  <div class="auth-hero">
    <div class="logo">🪙</div>
    <h1>记账小助手</h1>
    <p>3 秒记一笔，1 眼看清钱去哪</p>
  </div>
  <div class="auth-body">
    <div class="auth-seg">
      <button id="segLogin" class="on">登录</button>
      <button id="segReg">注册</button>
    </div>
    <div class="auth-err" id="authErr"></div>
    <div class="field">
      <label for="authUser">账户</label>
      <input id="authUser" type="text" autocomplete="username" maxlength="20" placeholder="请输入账户名">
    </div>
    <div class="field">
      <label for="authPwd">密码</label>
      <input id="authPwd" type="password" autocomplete="current-password" maxlength="40" placeholder="请输入密码">
    </div>
    <div class="field" id="fieldPwd2" style="display:none">
      <label for="authPwd2">确认密码</label>
      <input id="authPwd2" type="password" autocomplete="new-password" maxlength="40" placeholder="请再次输入密码">
      <div class="hint">账户名 ≥ 2 位，密码 ≥ 6 位。数据仅存于本机浏览器。</div>
    </div>
    <button class="auth-submit" id="authSubmit">登 录</button>
    <div class="auth-foot" id="authFoot"></div>
  </div>
</div>

<div id="app">
  <!-- 顶栏概览：明细/报表页共用位置，但内容不同 -->
  <div class="top" id="topbar"></div>

  <main>
    <!-- 明细 -->
    <section class="view active" id="view-detail"></section>
    <!-- 报表 -->
    <section class="view" id="view-report"></section>
    <!-- 我的 -->
    <section class="view" id="view-mine"></section>
  </main>

  <button class="fab" id="fab" aria-label="记一笔">+</button>

  <nav>
    <button class="tab-btn active" data-view="detail"><span class="ni">📒</span>明细</button>
    <button class="tab-btn" data-view="report"><span class="ni">📊</span>报表</button>
    <button class="tab-btn" data-view="mine"><span class="ni">⚙️</span>我的</button>
  </nav>
</div>

<!-- 记账抽屉 -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="记一笔">
  <div class="tabs">
    <button id="tabExp" class="on exp">支出</button>
    <button id="tabInc">收入</button>
  </div>
  <div class="amount-disp">
    <div class="expr" id="expr"></div>
    <div><span class="cur">¥</span><span class="num dim" id="amtNum">0</span></div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="extra">
    <input id="noteInput" type="text" maxlength="50" placeholder="备注（选填）">
    <label class="datepick"><span>📅</span><input id="dateInput" type="date"></label>
  </div>
  <div class="keypad" id="keypad">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="fn" data-k="del">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="fn" data-k="+">+</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="fn" data-k="-">−</button>
    <button data-k=".">.</button><button data-k="0">0</button>
    <button class="again" data-k="again">再记一笔</button>
    <button class="save exp" id="saveBtn" data-k="save">保存</button>
  </div>
</div>

<!-- 通用小弹层（预算/清空确认） -->
<div class="mini-modal-mask" id="modalMask">
  <div class="mini-modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ======================================================================
   记账小助手 v1.0.1 · 纯前端 · localStorage · 无网络依赖
   账户模型: jz_auth_v1 = { users:{ [name]:{salt,hash,created} }, session:name|null }
   账本模型: jz_book_v1__<name> = { records:[{id,type,amount,cat,note,date}], budget:Number }
   每个账号拥有独立账本；密码经加盐哈希后存储，不保存明文。
====================================================================== */
const AUTH_KEY = "jz_auth_v1";
const BOOK_PREFIX = "jz_book_v1__";
const LEGACY_KEY = "jz_helper_v1";        // v1.0 单账本旧数据，用于首次注册迁移
const CATS = {
  expense:[
    ["餐饮","🍜"],["交通","🚌"],["购物","🛍️"],["娱乐","🎮"],["居住","🏠"],
    ["通讯","📱"],["医疗","💊"],["教育","📚"],["人情","🧧"],["宠物","🐱"],
    ["旅行","✈️"],["其他","📦"]
  ],
  income:[["工资","💰"],["奖金","🎁"],["理财","📈"],["兼职","💼"],["其他","📦"]]
};
const SERIES = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];

/* ---------- state ---------- */
let currentUser = null;                 // 当前登录账户名
let db = { records:[], budget:0 };      // 当前账户的账本，登录后由 load() 填充
let cursor = new Date();                // 当前查看月份
let entry = null;                       // 记账草稿

/* ---------- 账户 / 鉴权 ---------- */
function loadAuth(){
  try{ const a=JSON.parse(localStorage.getItem(AUTH_KEY)); if(a&&a.users) return a; }catch(e){}
  return { users:{}, session:null };
}
function saveAuth(a){ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
function randSalt(){
  const b=new Uint8Array(16);
  (crypto&&crypto.getRandomValues)?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.floor(Math.random()*256));
  return Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");
}
/* 优先用 Web Crypto SHA-256，不可用时回退到简易哈希（本机锁场景足够） */
async function hashPwd(pwd,salt){
  const data=salt+"::"+pwd;
  if(crypto&&crypto.subtle){
    try{
      const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf),x=>x.toString(16).padStart(2,"0")).join("");
    }catch(e){}
  }
  let h=5381; for(let i=0;i<data.length;i++){ h=((h<<5)+h+data.charCodeAt(i))>>>0; }
  return "f"+h.toString(16);
}
async function registerUser(name,pwd){
  const auth=loadAuth();
  if(auth.users[name]) return {ok:false,msg:"该账户已存在，请直接登录"};
  const salt=randSalt(), hash=await hashPwd(pwd,salt);
  auth.users[name]={salt,hash,created:iso(new Date())};
  auth.session=name; saveAuth(auth);
  // 首次注册：迁移 v1.0 旧账本给该账户，避免历史数据丢失
  const legacy=localStorage.getItem(LEGACY_KEY);
  if(legacy && !localStorage.getItem(BOOK_PREFIX+name)){
    localStorage.setItem(BOOK_PREFIX+name, legacy);
    localStorage.removeItem(LEGACY_KEY);
  }
  return {ok:true};
}
async function loginUser(name,pwd){
  const auth=loadAuth(); const u=auth.users[name];
  if(!u) return {ok:false,msg:"账户不存在，请先注册"};
  const hash=await hashPwd(pwd,u.salt);
  if(hash!==u.hash) return {ok:false,msg:"密码不正确"};
  auth.session=name; saveAuth(auth);
  return {ok:true};
}
function logoutUser(){ const a=loadAuth(); a.session=null; saveAuth(a); }

/* ---------- 账本读写（按当前账户隔离）---------- */
function bookKey(){ return BOOK_PREFIX+currentUser; }
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(bookKey()));
    if(raw && Array.isArray(raw.records)) return raw;
  }catch(e){}
  return { records:seedData(), budget:0 };   // 新账户给一份演示数据
}
function save(){ if(currentUser) localStorage.setItem(bookKey(), JSON.stringify(db)); }

/* 首次进入给一点演示数据，让报表不空 */
function seedData(){
  const now = new Date(), y=now.getFullYear(), m=now.getMonth();
  const mk=(day,type,amount,cat,note)=>({id:uid(),type,amount,cat,note,
    date:iso(new Date(y,m,day))});
  return [
    mk(now.getDate(),"expense",32,"餐饮","午餐 便当"),
    mk(now.getDate(),"expense",6,"交通","地铁"),
    mk(Math.max(1,now.getDate()-1),"expense",128,"购物","T恤"),
    mk(Math.max(1,now.getDate()-1),"expense",45,"餐饮","火锅 AA"),
    mk(Math.max(1,now.getDate()-2),"expense",18,"娱乐","电影票折扣"),
    mk(Math.max(1,now.getDate()-2),"expense",88,"通讯","话费充值"),
    mk(Math.max(1,now.getDate()-3),"income",8500,"工资","八月薪资"),
    mk(Math.max(1,now.getDate()-4),"expense",240,"居住","水电燃气"),
    mk(Math.max(1,now.getDate()-5),"expense",60,"餐饮","聚餐"),
    mk(Math.max(1,now.getDate()-6),"expense",320,"教育","网课"),
  ];
}

/* ---------- utils ---------- */
function uid(){ return "r"+Date.now().toString(36)+Math.floor(performance.now()*100%1000); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(n){ return (Math.round(n*100)/100).toLocaleString("zh-CN",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); }
function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function catIcon(type,name){ const f=(CATS[type]||[]).find(c=>c[0]===name); return f?f[1]:"📦"; }
function recsOfMonth(){
  const mk=monthKey(cursor);
  return db.records.filter(r=>r.date.slice(0,7)===mk);
}

let toastTimer;
function toast(msg,kind){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show"+(kind?" "+kind:"");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className="toast",1900);
}

/* ======================================================================
   视图切换
====================================================================== */
let activeView="detail";
document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click",()=>switchView(b.dataset.view));
});
function switchView(v){
  activeView=v;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("active"));
  document.getElementById("view-"+v).classList.add("active");
  render();
}

/* ======================================================================
   渲染入口
====================================================================== */
function render(){
  renderTop();
  if(activeView==="detail") renderDetail();
  else if(activeView==="report") renderReport();
  else renderMine();
}

/* ---------- 顶栏 ---------- */
function renderTop(){
  const top=document.getElementById("topbar");
  if(activeView==="mine"){
    top.innerHTML=`<div class="month-row"><span class="label">我的</span></div>`;
    return;
  }
  const recs=recsOfMonth();
  const exp=recs.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
  const inc=recs.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
  const bal=inc-exp;
  const label=cursor.getFullYear()+" 年 "+(cursor.getMonth()+1)+" 月";

  let budgetHtml="";
  if(activeView==="detail" && db.budget>0){
    const used=exp, ratio=Math.min(used/db.budget,1);
    const pct=Math.round(used/db.budget*100);
    const cls=pct>=100?"over":(pct>=80?"near":"");
    const left=db.budget-used;
    budgetHtml=`<div class="budget">
      <div class="budget-head"><span>本月预算 ¥${fmt(db.budget)}</span>
        <span>${left>=0?"剩 ¥"+fmt(left):"超 ¥"+fmt(-left)} · ${pct}%</span></div>
      <div class="budget-bar"><i class="${cls}" style="width:${ratio*100}%"></i></div>
    </div>`;
  }

  top.innerHTML=`
    <div class="month-row">
      <button id="prevM" aria-label="上个月">‹</button>
      <span class="label">${label}</span>
      <button id="nextM" aria-label="下个月">›</button>
    </div>
    <div class="overview">
      <div class="ov-label">本月结余</div>
      <div class="ov-balance tnum">${bal>=0?"":"-"}¥${fmt(Math.abs(bal))}</div>
      <div class="ov-split">
        <div><div class="k">支出</div><div class="v exp tnum">¥${fmt(exp)}</div></div>
        <div><div class="k">收入</div><div class="v inc tnum">¥${fmt(inc)}</div></div>
      </div>
      ${budgetHtml}
    </div>`;
  document.getElementById("prevM").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render();};
  document.getElementById("nextM").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render();};
}

/* ---------- 明细 / 流水 ---------- */
function renderDetail(){
  const el=document.getElementById("view-detail");
  const recs=recsOfMonth().slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  if(!recs.length){
    el.innerHTML=`<div class="empty"><div class="big">🪙</div>
      <p>这个月还没有记账</p><p class="hint">点下方「＋」，3 秒记一笔</p></div>`;
    return;
  }
  // 按日分组
  const groups={};
  recs.forEach(r=>{ (groups[r.date]=groups[r.date]||[]).push(r); });
  const days=Object.keys(groups).sort().reverse();
  let html="";
  days.forEach(day=>{
    const items=groups[day];
    const dExp=items.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
    const dInc=items.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
    const d=new Date(day+"T00:00:00");
    const wd=["日","一","二","三","四","五","六"][d.getDay()];
    const dlabel=(d.getMonth()+1)+"月"+d.getDate()+"日 周"+wd;
    let sum=[]; if(dExp)sum.push("支 ¥"+fmt(dExp)); if(dInc)sum.push("收 ¥"+fmt(dInc));
    html+=`<div class="day-group">
      <div class="day-head"><span class="d">${dlabel}</span><span class="sum">${sum.join("　")}</span></div>
      <div class="rec-card">`;
    items.forEach(r=>{
      html+=`<div class="rec-wrap">
        <div class="rec-del">删除</div>
        <div class="rec" data-id="${r.id}">
          <div class="ico">${catIcon(r.type,r.cat)}</div>
          <div class="meta"><div class="cat">${r.cat}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}</div>
          <div class="amt ${r.type==="income"?"inc":"exp"} tnum">${r.type==="income"?"+":"-"}${fmt(r.amount)}</div>
        </div></div>`;
    });
    html+=`</div></div>`;
  });
  el.innerHTML=html;
  bindRecords(el);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 记录：点击编辑 / 左滑删除 */
function bindRecords(scope){
  scope.querySelectorAll(".rec").forEach(rec=>{
    let startX=0,cur=0,dragging=false;
    const w=rec.parentElement;
    rec.addEventListener("click",()=>{ if(Math.abs(cur)<6) openSheet(rec.dataset.id); });
    rec.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;dragging=true;},{passive:true});
    rec.addEventListener("touchmove",e=>{
      if(!dragging)return; cur=Math.min(0,Math.max(-76,e.touches[0].clientX-startX));
      rec.style.transform=`translateX(${cur}px)`;
    },{passive:true});
    rec.addEventListener("touchend",()=>{
      dragging=false;
      if(cur<-40){cur=-76;rec.style.transform="translateX(-76px)";}
      else{cur=0;rec.style.transform="none";}
    });
    w.querySelector(".rec-del").addEventListener("click",()=>askDelete(rec.dataset.id));
    // 桌面端：右键或双击也能删（可选）
  });
}
function askDelete(id){
  showModal({
    title:"删除这条记录？", desc:"删除后无法恢复。",
    confirmText:"删除", danger:true,
    onConfirm:()=>{ db.records=db.records.filter(r=>r.id!==id); save(); render(); toast("已删除"); }
  });
}

/* ======================================================================
   记账抽屉逻辑
====================================================================== */
const sheet=document.getElementById("sheet"), sheetMask=document.getElementById("sheetMask");
const amtNum=document.getElementById("amtNum"), exprEl=document.getElementById("expr");
const saveBtn=document.getElementById("saveBtn");
const tabExp=document.getElementById("tabExp"), tabInc=document.getElementById("tabInc");

function openSheet(editId){
  if(editId){
    const r=db.records.find(x=>x.id===editId);
    entry={editId, type:r.type, raw:String(r.amount), cat:r.cat, note:r.note||"", date:r.date, op:null, prev:null};
  }else{
    entry={editId:null, type:"expense", raw:"", cat:null, note:"", date:iso(new Date()), op:null, prev:null};
  }
  document.getElementById("noteInput").value=entry.note;
  document.getElementById("dateInput").value=entry.date;
  syncType(); renderCats(); syncAmount();
  sheetMask.classList.add("open"); sheet.classList.add("open");
}
function closeSheet(){ sheet.classList.remove("open"); sheetMask.classList.remove("open"); }
sheetMask.addEventListener("click",closeSheet);
document.getElementById("fab").addEventListener("click",()=>openSheet(null));

tabExp.addEventListener("click",()=>{entry.type="expense";entry.cat=null;syncType();renderCats();});
tabInc.addEventListener("click",()=>{entry.type="income";entry.cat=null;syncType();renderCats();});
function syncType(){
  const isExp=entry.type==="expense";
  tabExp.className="on exp"; tabInc.className="";
  if(!isExp){tabExp.className="";tabInc.className="on inc";}
  saveBtn.className="save"+(isExp?" exp":"");
}
function renderCats(){
  const wrap=document.getElementById("cats");
  wrap.innerHTML=CATS[entry.type].map(([n,e])=>
    `<button class="cat-item ${entry.type==="expense"?"exp":""} ${entry.cat===n?"sel":""}" data-cat="${n}">
      <span class="e">${e}</span><span class="n">${n}</span></button>`).join("");
  wrap.querySelectorAll(".cat-item").forEach(b=>b.onclick=()=>{
    entry.cat=b.dataset.cat; renderCats();
  });
}
document.getElementById("noteInput").addEventListener("input",e=>entry.note=e.target.value);
document.getElementById("dateInput").addEventListener("change",e=>entry.date=e.target.value||iso(new Date()));

/* 数字键盘 */
document.getElementById("keypad").addEventListener("click",e=>{
  const k=e.target.closest("button"); if(!k)return;
  const key=k.dataset.k;
  if(key==="save"){ doSave(false); return; }
  if(key==="again"){ doSave(true); return; }
  handleKey(key);
});
function handleKey(key){
  if(key==="del"){ entry.raw=entry.raw.slice(0,-1); }
  else if(key==="+"||key==="-"){
    if(entry.raw!==""){ entry.prev=(entry.prev||0)+ (entry.op==="-"?-parseFloat(entry.raw):parseFloat(entry.raw)); }
    else if(entry.prev===null){ entry.prev=0; }
    entry.op=key; entry.raw="";
  }
  else if(key==="."){ if(!entry.raw.includes(".")) entry.raw=(entry.raw||"0")+"."; }
  else{ // 数字
    if(entry.raw.includes(".")&&entry.raw.split(".")[1].length>=2) return;
    if(entry.raw==="0") entry.raw=key; else entry.raw+=key;
  }
  syncAmount();
}
function currentValue(){
  const cur = entry.raw===""?0:parseFloat(entry.raw);
  if(entry.op==="+"||entry.op==="-"){
    if(entry.raw==="") return entry.prev||0;
    return (entry.prev||0) + (entry.op==="-"?-cur:cur);
  }
  return cur;
}
function syncAmount(){
  const v=currentValue();
  amtNum.textContent = fmt(v);
  amtNum.classList.toggle("dim", v===0 && entry.raw==="");
  // 显示算式
  if(entry.op && (entry.prev!==null)){
    exprEl.textContent = fmt(entry.prev||0)+" "+(entry.op==="-"?"−":"+")+" "+(entry.raw||"…");
  }else exprEl.textContent="";
  const ok = v>0;
  saveBtn.disabled = !ok;
}
function doSave(again){
  const v=currentValue();
  if(!(v>0)){ toast("请输入金额","crit"); return; }
  if(!entry.cat){ toast("请选择一个分类","warn"); return; }
  if(entry.editId){
    const r=db.records.find(x=>x.id===entry.editId);
    Object.assign(r,{type:entry.type,amount:v,cat:entry.cat,note:entry.note,date:entry.date});
    toast("已更新");
  }else{
    db.records.push({id:uid(),type:entry.type,amount:v,cat:entry.cat,note:entry.note,date:entry.date});
    toast(again?"已记 · 继续":"已记一笔 ✓");
  }
  save(); checkBudget();
  if(again && !entry.editId){
    const keepType=entry.type,keepDate=entry.date;
    entry={editId:null,type:keepType,raw:"",cat:null,note:"",date:keepDate,op:null,prev:null};
    document.getElementById("noteInput").value=""; syncType(); renderCats(); syncAmount();
  }else{ closeSheet(); }
  render();
}
function checkBudget(){
  if(db.budget<=0) return;
  const exp=recsOfMonth().filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
  const pct=exp/db.budget*100;
  if(pct>=100) toast("已超出本月预算！","crit");
  else if(pct>=80) toast("预算已用 "+Math.round(pct)+"%","warn");
}

/* ======================================================================
   报表：概览 + 环形分类占比 + 日趋势 + 分类排行  (dataviz 规范)
====================================================================== */
function renderReport(){
  const el=document.getElementById("view-report");
  const recs=recsOfMonth();
  const exps=recs.filter(r=>r.type==="expense");
  const totalExp=exps.reduce((s,r)=>s+r.amount,0);
  const totalInc=recs.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
  const days=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
  const now=new Date();
  const isCurMonth = cursor.getFullYear()===now.getFullYear() && cursor.getMonth()===now.getMonth();
  const elapsed = isCurMonth? now.getDate() : days;
  const avg = elapsed? totalExp/elapsed : 0;

  if(!recs.length){
    el.innerHTML=`<div class="empty"><div class="big">📊</div>
      <p>本月暂无数据</p><p class="hint">记几笔后，这里会显示消费结构</p></div>`;
    return;
  }

  // 分类聚合
  const byCat={};
  exps.forEach(r=>byCat[r.cat]=(byCat[r.cat]||0)+r.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  // 环形图
  const donut=buildDonut(cats,totalExp);

  // 日趋势
  const dayTotals=new Array(days).fill(0);
  exps.forEach(r=>{ const d=parseInt(r.date.slice(8,10),10); dayTotals[d-1]+=r.amount; });
  const maxDay=Math.max(...dayTotals,1);
  const todayIdx = isCurMonth? now.getDate()-1 : -1;
  let bars="";
  for(let i=0;i<days;i++){
    const h=dayTotals[i]/maxDay*100;
    const showLbl = (i===0||(i+1)%5===0||i===days-1);
    bars+=`<div class="bar-col" title="${i+1}日 ¥${fmt(dayTotals[i])}">
      <div class="bar ${i===todayIdx?"today":""}" style="height:${h}%"></div>
      <div class="lbl">${showLbl?(i+1):""}</div></div>`;
  }

  // 排行
  let rank="";
  cats.slice(0,8).forEach(([name,amt],i)=>{
    const pct=totalExp?amt/totalExp*100:0;
    const color=SERIES[i%SERIES.length];
    rank+=`<div class="rank-row">
      <div class="ico">${catIcon("expense",name)}</div>
      <div class="info"><div class="nm">${name}</div>
        <div class="mini"><i style="width:${pct}%;background:${color}"></i></div></div>
      <div class="amt tnum">¥${fmt(amt)}<small>${pct.toFixed(1)}%</small></div>
    </div>`;
  });

  el.innerHTML=`
    <div class="section-t">月度概览</div>
    <div class="stat-row">
      <div class="stat"><div class="k">总支出</div><div class="v exp tnum">¥${fmt(totalExp)}</div></div>
      <div class="stat"><div class="k">总收入</div><div class="v inc tnum">¥${fmt(totalInc)}</div></div>
      <div class="stat"><div class="k">结余</div><div class="v tnum">${totalInc-totalExp<0?"-":""}¥${fmt(Math.abs(totalInc-totalExp))}</div></div>
      <div class="stat"><div class="k">日均支出</div><div class="v tnum">¥${fmt(avg)}</div></div>
    </div>

    <div class="section-t">支出构成</div>
    <div class="card">${donut}</div>

    <div class="section-t">日支出趋势</div>
    <div class="card"><div class="trend">${bars}</div></div>

    <div class="section-t">分类排行</div>
    <div class="card" style="padding:6px 18px">${rank}</div>
  `;

  // 图例交互：点击下钻
  el.querySelectorAll(".legend-row").forEach(row=>{
    row.addEventListener("click",()=>drillCat(row.dataset.cat));
  });
}

/* SVG 环形图 —— 系列色固定顺序，文字用墨色 token；>4 类必带图例，标签不靠颜色单独承担 */
function buildDonut(cats,total){
  if(!total){ return `<p style="color:var(--muted);font-size:13px">本月暂无支出</p>`; }
  const R=54, C=2*Math.PI*R, sw=20;
  let off=0, arcs="";
  cats.forEach(([name,amt],i)=>{
    const frac=amt/total, len=frac*C;
    const color=SERIES[i%SERIES.length];
    arcs+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 70 70)"><title>${name} ¥${fmt(amt)}</title></circle>`;
    off+=len;
  });
  // 图例（含金额+占比，识别不靠颜色单独承担）
  const legend=cats.map(([name,amt],i)=>{
    const pct=(amt/total*100);
    return `<div class="legend-row" data-cat="${name}">
      <span class="dot" style="background:${SERIES[i%SERIES.length]}"></span>
      <span class="nm">${catIcon("expense",name)} ${name}</span>
      <span class="pct tnum">${pct.toFixed(0)}%</span>
      <span class="val tnum">¥${fmt(amt)}</span></div>`;
  }).join("");
  return `<div class="donut-wrap">
    <svg class="donut" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="分类支出占比">
      ${arcs}
      <text x="70" y="64" text-anchor="middle" font-size="11" fill="var(--muted)">总支出</text>
      <text x="70" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)" class="donut-center">¥${fmt(total)}</text>
    </svg>
    <div class="legend">${legend}</div>
  </div>`;
}
function drillCat(name){
  const recs=recsOfMonth().filter(r=>r.type==="expense"&&r.cat===name);
  const total=recs.reduce((s,r)=>s+r.amount,0);
  const rows=recs.slice().sort((a,b)=>a.date<b.date?1:-1).map(r=>
    `<div class="rank-row"><div class="ico">${catIcon("expense",name)}</div>
      <div class="info"><div class="nm">${r.date.slice(5)} ${r.note?esc(r.note):"—"}</div></div>
      <div class="amt tnum">¥${fmt(r.amount)}</div></div>`).join("");
  showModal({
    title:catIcon("expense",name)+" "+name, desc:"本月共 "+recs.length+" 笔 · 合计 ¥"+fmt(total),
    html:`<div style="max-height:46vh;overflow:auto;margin-bottom:14px">${rows}</div>`,
    confirmText:"关闭", single:true
  });
}

/* ======================================================================
   我的：预算 / 分类 / 提醒(占位) / 导出 / 清空
====================================================================== */
function renderMine(){
  const el=document.getElementById("view-mine");
  el.innerHTML=`
    <div class="section-t">账户</div>
    <div class="list">
      <div class="li"><span class="e">👤</span>当前账户<span class="sub">${esc(currentUser||"")}</span></div>
      <button class="li" id="logout"><span class="e">🚪</span><span style="color:var(--crit)">退出登录</span><span class="arr">›</span></button>
    </div>

    <div class="section-t">预算</div>
    <div class="list">
      <button class="li" id="setBudget"><span class="e">🎯</span>月度总预算
        <span class="sub">${db.budget>0?"¥"+fmt(db.budget):"未设置"}</span></button>
    </div>

    <div class="section-t">记账</div>
    <div class="list">
      <div class="li"><span class="e">🏷️</span>分类管理<span class="sub">预置 ${CATS.expense.length}+${CATS.income.length}</span></div>
      <div class="li"><span class="e">🔔</span>记账提醒<span class="sub">每日 21:00</span></div>
    </div>

    <div class="section-t">数据</div>
    <div class="list">
      <button class="li" id="exportCsv"><span class="e">📤</span>导出 CSV<span class="arr">›</span></button>
      <button class="li" id="backup"><span class="e">💾</span>备份数据<span class="arr">›</span></button>
      <button class="li" id="restore"><span class="e">📥</span>恢复备份<span class="arr">›</span></button>
      <button class="li" id="clearAll"><span class="e" style="filter:grayscale(0)">🗑️</span><span style="color:var(--crit)">清空所有数据</span><span class="arr">›</span></button>
    </div>

    <div class="brandline">共 <b>${db.records.length}</b> 条记录 · 全部存于本机<br>
      <b>记账小助手</b> v1.0.1 · 3 秒记一笔，1 眼看清钱去哪</div>
  `;
  document.getElementById("logout").onclick=doLogout;
  document.getElementById("setBudget").onclick=openBudget;
  document.getElementById("exportCsv").onclick=exportCSV;
  document.getElementById("backup").onclick=backup;
  document.getElementById("restore").onclick=restore;
  document.getElementById("clearAll").onclick=clearAll;
}

function doLogout(){
  showModal({
    title:"退出登录？", desc:"你的账本数据仍保存在本机，重新登录即可查看。",
    confirmText:"退出",
    onConfirm:()=>{
      logoutUser();
      currentUser=null; db={records:[],budget:0};
      showAuthGate();
    }
  });
}

function openBudget(){
  showModal({
    title:"设置月度总预算", desc:"用于首页进度条与超支提醒，留空则不启用。",
    inputValue: db.budget>0?db.budget:"", inputPlaceholder:"0.00",
    confirmText:"保存",
    onConfirm:(val)=>{ db.budget=Math.max(0,parseFloat(val)||0); save(); render(); toast(db.budget>0?"预算已更新":"已关闭预算"); }
  });
}

function exportCSV(){
  const rows=[["日期","类型","分类","金额","备注"]];
  db.records.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(r=>
    rows.push([r.date, r.type==="expense"?"支出":"收入", r.cat, r.amount, (r.note||"").replace(/,/g,"，")]));
  const csv="﻿"+rows.map(r=>r.join(",")).join("\n");
  download(csv,"text/csv","记账_"+monthKey(new Date())+".csv");
  toast("已导出 CSV");
}
function backup(){
  download(JSON.stringify(db,null,2),"application/json","记账备份_"+iso(new Date())+".json");
  toast("已导出备份文件");
}
function restore(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const obj=JSON.parse(rd.result);
      if(!obj||!Array.isArray(obj.records)) throw 0;
      db=obj; save(); render(); toast("已恢复备份 ✓");
    }catch(e){ toast("文件格式不正确","crit"); } };
    rd.readAsText(f);
  };
  inp.click();
}
function clearAll(){
  showModal({
    title:"清空所有数据？", desc:'此操作不可恢复。输入「删除」以确认。',
    inputPlaceholder:"输入：删除", confirmText:"永久删除", danger:true,
    onConfirm:(val)=>{
      if(val!=="删除"){ toast("确认文字不正确","crit"); return false; }
      db={records:[],budget:0}; save(); render(); toast("已清空");
    }
  });
}
function download(content,type,name){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ======================================================================
   通用小弹层
====================================================================== */
const modalMask=document.getElementById("modalMask"), modalBox=document.getElementById("modalBox");
function showModal(o){
  const hasInput = o.inputPlaceholder!==undefined || o.inputValue!==undefined;
  modalBox.innerHTML=`
    <h3>${o.title}</h3>${o.desc?`<p>${o.desc}</p>`:""}
    ${o.html||""}
    ${hasInput?`<input id="mInput" placeholder="${o.inputPlaceholder||""}" value="${o.inputValue||""}">`:""}
    <div class="btns">
      ${o.single?"":`<button class="ghost" id="mCancel">取消</button>`}
      <button class="primary" id="mOk" style="${o.danger?"background:var(--crit)":""}">${o.confirmText||"确定"}</button>
    </div>`;
  modalMask.classList.add("open");
  const close=()=>modalMask.classList.remove("open");
  const cancel=document.getElementById("mCancel"); if(cancel)cancel.onclick=close;
  document.getElementById("mOk").onclick=()=>{
    const val=hasInput?document.getElementById("mInput").value.trim():undefined;
    if(o.onConfirm){ const r=o.onConfirm(val); if(r===false) return; }
    close();
  };
  const mi=document.getElementById("mInput");
  if(mi){ mi.focus(); mi.type = (o.inputPlaceholder==="0.00"||o.inputValue)? (isNaN(o.inputValue)?"text":"number"):mi.type;
    if(o.title.includes("预算")) mi.type="number"; }
}
modalMask.addEventListener("click",e=>{ if(e.target===modalMask) modalMask.classList.remove("open"); });

/* ======================================================================
   登录 / 注册门禁
====================================================================== */
const authGate=document.getElementById("authGate");
const segLogin=document.getElementById("segLogin"), segReg=document.getElementById("segReg");
const authUser=document.getElementById("authUser"), authPwd=document.getElementById("authPwd");
const authPwd2=document.getElementById("authPwd2"), fieldPwd2=document.getElementById("fieldPwd2");
const authErr=document.getElementById("authErr"), authSubmit=document.getElementById("authSubmit");
const authFoot=document.getElementById("authFoot");
let authMode="login";

function setAuthMode(m){
  authMode=m;
  segLogin.classList.toggle("on",m==="login");
  segReg.classList.toggle("on",m==="register");
  fieldPwd2.style.display = m==="register"?"block":"none";
  authSubmit.textContent = m==="login"?"登 录":"注 册";
  authPwd.autocomplete = m==="login"?"current-password":"new-password";
  authErr.classList.remove("show");
  const n=Object.keys(loadAuth().users).length;
  authFoot.innerHTML = m==="login"
    ? (n?`还没有账户？点上方「注册」`:`首次使用？点上方「注册」创建账户`)
    : `账户与数据仅保存在<b>本机浏览器</b>，不上传服务器`;
}
segLogin.onclick=()=>setAuthMode("login");
segReg.onclick=()=>setAuthMode("register");
function authError(msg){ authErr.textContent=msg; authErr.classList.add("show"); }

async function doAuth(){
  const name=authUser.value.trim(), pwd=authPwd.value;
  if(name.length<2) return authError("账户名至少 2 位");
  if(pwd.length<6) return authError("密码至少 6 位");
  if(authMode==="register" && pwd!==authPwd2.value) return authError("两次输入的密码不一致");
  authSubmit.disabled=true;
  const res = authMode==="login" ? await loginUser(name,pwd) : await registerUser(name,pwd);
  authSubmit.disabled=false;
  if(!res.ok) return authError(res.msg);
  enterApp(name);
}
authSubmit.onclick=doAuth;
[authUser,authPwd,authPwd2].forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter") doAuth(); }));

function enterApp(name){
  currentUser=name;
  db=load();
  cursor=new Date();
  authGate.classList.remove("show");
  authUser.value=""; authPwd.value=""; authPwd2.value="";
  switchView("detail");
  toast("欢迎，"+name);
}
function showAuthGate(){
  authGate.classList.add("show");
  setAuthMode("login");
}

/* ======================================================================
   启动
====================================================================== */
(function boot(){
  const auth=loadAuth();
  if(auth.session && auth.users[auth.session]){
    currentUser=auth.session; db=load(); render();
  }else{
    showAuthGate();
  }
})();
</script>
